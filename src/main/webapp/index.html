<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Murach's Java Servlets and JSP</title>
    <link rel="stylesheet" href="styles/survey.css">
</head>
<body>
    <header>
        <img src="images/murach_logo.png" alt="Murach logo" width="150" height="150">
        <h1>Survey</h1>
        <p>If you have a moment, we'd appreciate it if you would fill out this survey.</p>
    </header>

    <main>
        <form action="survey" method="post">

            <section>
                <h2>Your information:</h2>
                <div class="field">
                    <label for="firstName">First Name</label>
                    <input type="text" id="firstName" name="firstName" required>
                </div>
                <div class="field">
                    <label for="lastName">Last Name</label>
                    <input type="text" id="lastName" name="lastName" required>
                </div>
                <div class="field">
                    <label for="email">Email</label>
                    <input type="email" id="email" name="email" placeholder="name@example.com" required>
                </div>
               <div class="field">
                    <label for="dob">Date of Birth</label>
                    <input type="text" id="dob" name="dob" placeholder="MM/DD/YYYY">
               </div>
            </section>

            <section>
                <h2>How did you hear about us?</h2>
                <fieldset class="choices">
                    <legend class="sr-only">How did you hear about us?</legend>
                       <label><input type="radio" name="heardFrom" value="Search engine" checked> Search engine</label>
                       <label><input type="radio" name="heardFrom" value="Word of mouth"> Word of mouth</label>
                       <label><input type="radio" name="heardFrom" value="Social Media"> Social Media</label>
                       <label><input type="radio" name="heardFrom" value="Other"> Other</label>
                </fieldset>
            </section>

            <section>
                <h2>Would you like to receive announcements about new CDs and special offers?</h2>
                   <label class="check"><input type="checkbox" name="wantsUpdates"> YES, I'd like that.</label>
                   <label class="check"><input type="checkbox" name="emailOK"> YES, please send me email announcements.</label>
                <div class="field">
                    <label for="contactVia">Please contact me by:</label>
                    <select id="contactVia" name="contactVia">
                        <option>Email or postal mail</option>
                        <option>Email only</option>
                        <option>Postal mail only</option>
                    </select>
                </div>
            </section>

            <input type="submit" value="Submit">
        </form>
    </main>
</body>
</html>
